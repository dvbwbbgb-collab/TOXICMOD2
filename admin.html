<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOXICMOD1 Admin</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;padding:20px}.panel{max-width:650px;margin:auto}
.card{background:#1d1d1d;padding:18px;border-radius:12px;margin:15px 0}
input,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:0;border-radius:8px;font-size:16px}
button{background:#333;color:#fff}.key{background:#292929;padding:12px;border-radius:8px;margin-top:8px}
</style></head>
<body><div class="panel">
<h1>TOXICMOD1 ADMIN</h1>
<div class="card"><h2>Generate Key</h2>
<input id="days" type="number" value="30" min="1" placeholder="Validity days">
<button onclick="generateKey()">GENERATE KEY</button><p id="newKey"></p></div>
<div class="card"><h2>Keys</h2><div id="keys"></div></div>
</div>
<script>
let keys=JSON.parse(localStorage.getItem("toxic_keys")||"[]");
function save(){localStorage.setItem("toxic_keys",JSON.stringify(keys));render()}
function generateKey(){let c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",k="TOXIC-";for(let i=0;i<12;i++)k+=c[Math.floor(Math.random()*c.length)];let d=Math.max(1,Number(days.value)||30);keys.push({key:k,expires:Date.now()+d*86400000,device:"Not bound",blocked:false});newKey.textContent="New Key: "+k;save()}
function render(){keysDiv=document.getElementById("keys");if(!keys.length){keysDiv.innerHTML="<p>No keys yet.</p>";return}keysDiv.innerHTML=keys.map((x,i)=>`<div class="key"><b>${x.key}</b><br>Expires: ${new Date(x.expires).toLocaleString()}<br>Device: ${x.device}<br>Status: ${x.blocked?"BLOCKED":"ACTIVE"}<br><button onclick="toggle(${i})">${x.blocked?"UNBLOCK":"BLOCK"}</button><button onclick="removeKey(${i})">DELETE</button></div>`).join("")}
function toggle(i){keys[i].blocked=!keys[i].blocked;save()}function removeKey(i){keys.splice(i,1);save()}render();
</script></body></html>
